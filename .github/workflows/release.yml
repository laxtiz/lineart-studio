name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: appimage,deb,rpm
            no_strip: "1"
          - platform: macos-14
            bundles: dmg
            no_strip: ""
          - platform: windows-2022
            bundles: msi,nsis
            no_strip: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build desktop bundle
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          NO_STRIP: ${{ matrix.no_strip }}
      - uses: actions/upload-artifact@v4
        with:
          name: lineart-studio-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lineart-studio-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          shopt -s nullglob globstar
          assets=(
            release-assets/**/appimage/*.AppImage
            release-assets/**/deb/*.deb
            release-assets/**/rpm/*.rpm
            release-assets/**/dmg/*.dmg
            release-assets/**/msi/*.msi
            release-assets/**/nsis/*.exe
          )
          test "${#assets[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LineartStudio $RELEASE_TAG" \
            --generate-notes
